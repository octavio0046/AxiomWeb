<div class="login-page">
  <div class="login-shell">
    <section class="login-brand" aria-label="Axiom">
      <h1 class="login-brand__name">Axiom</h1>
      <p class="login-brand__tagline">Tu punto de venta, claro y listo para vender.</p>
      <p class="login-brand__note">
        Gestiona productos, clientes, compras y ventas desde un solo lugar.
      </p>
    </section>

    <section class="login-card" aria-label="Iniciar sesión">
      <h2 class="login-card__title">Axiom</h2>

      @if (error()) {
        <div class="login-alert" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="login-field">
          <label for="username">Usuario</label>
          <input
            id="username"
            type="text"
            class="login-input"
            [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
            formControlName="username"
            autocomplete="username"
            placeholder="Tu usuario"
          />
        </div>

        <div class="login-field">
          <label for="password">Contraseña</label>
          <div class="login-password">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="login-input"
              [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Tu contraseña"
            />
            <button
              type="button"
              class="login-password__toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <i class="bi" [class.bi-eye]="!showPassword()" [class.bi-eye-slash]="showPassword()"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-submit" [disabled]="loading()">
          @if (loading()) {
            Ingresando...
          } @else {
            Entrar
          }
        </button>
      </form>

      <div class="login-divider" aria-hidden="true"></div>
      <p class="login-footnote">Acceso seguro para tu equipo de trabajo</p>
    </section>
  </div>
</div>
